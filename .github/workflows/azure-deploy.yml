name: Deploy to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-frontend:
    name: Build & Deploy Frontend (Azure App Service)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: artifacts/gym-bro
        env:
          BASE_PATH: /
          PORT: "3000"
          NODE_ENV: production
          VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: pnpm run build

      - name: Package frontend for deployment
        run: |
          mkdir -p frontend-package
          cp -r artifacts/gym-bro/dist/public frontend-package/public
          cp artifacts/gym-bro/server.mjs frontend-package/server.mjs
          printf '{"name":"gym-bro-frontend","version":"1.0.0","private":true,"type":"module","engines":{"node":">=22"},"scripts":{"start":"node server.mjs"}}' \
            > frontend-package/package.json
          cd frontend-package && zip -r ../frontend-deploy.zip .

      - name: Deploy to Azure App Service (Frontend)
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_FRONTEND_APP_NAME }}
          publish-profile: ${{ secrets.AZURE_FRONTEND_PUBLISH_PROFILE }}
          package: frontend-deploy.zip

  deploy-api:
    name: Build & Deploy API (Azure App Service)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API server
        run: pnpm --filter @workspace/api-server run build

      - name: Package API for deployment
        run: |
          mkdir -p api-package
          cp -r artifacts/api-server/dist api-package/dist
          printf '{"name":"gym-bro-api","version":"1.0.0","private":true,"type":"module","engines":{"node":">=22"},"scripts":{"start":"node --enable-source-maps ./dist/index.mjs"}}' \
            > api-package/package.json
          cd api-package && zip -r ../api-deploy.zip .

      - name: Deploy to Azure App Service (API)
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_API_APP_NAME }}
          publish-profile: ${{ secrets.AZURE_API_PUBLISH_PROFILE }}
          package: api-deploy.zip
